<section class="projects-section">
  <div class="container">
    <div class="section-header reveal">
      <span class="section-label">Mes réalisations</span>
      <h2 class="section-title">Projets principaux</h2>
    </div>

    <div class="projects-grid">
      <div class="project-card reveal" *ngFor="let project of projects; let i = index" [class]="'delay-' + (i + 1)">
        <div class="project-image" [style.background]="project.gradient">
          <i class="fas {{ project.icon }}"></i>
          <div class="project-overlay">
            <span class="overlay-text">Voir le projet</span>
          </div>
        </div>
        <div class="project-info">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="tech-stack">
            <span *ngFor="let tech of project.technologies">{{ tech }}</span>
          </div>
          <div class="project-links">
            <a href="#" class="project-link">
              <i class="fas fa-external-link-alt"></i> Voir le projet
            </a>
            <a href="#" class="project-link">
              <i class="fab fa-github"></i> Code
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
