<section class="projects-section">
  <div class="container">
    <div class="section-header reveal">
      <span class="section-label">Mes réalisations</span>
      <h2 class="section-title">Projets principaux</h2>
    </div>

    <div class="projects-grid">
      <div class="project-card reveal" 
           *ngFor="let project of projects; let i = index" 
           [class]="'delay-' + (i + 1)">
        
        <!-- Image du projet avec fallback -->
        <div class="project-image" 
             [style.background]="project.image ? 'transparent' : project.gradient">
          
          <!-- Image si disponible -->
          <img *ngIf="project.image" 
               [src]="project.image" 
               [alt]="project.title"
               class="project-img">
          
          <!-- Icône de fallback si pas d'image -->
          <i *ngIf="!project.image" 
             class="fas {{ project.icon }}"></i>

          <!-- ✅ Badge catégorie (PHP, etc.) -->
          <span *ngIf="project.category" class="category-badge">
            <i class="fab fa-php"></i> {{ project.category }}
          </span>
          
          <div class="project-overlay">
            <span class="overlay-text">
              <i class="fas fa-eye"></i> Voir le projet
            </span>
          </div>
        </div>

        <!-- Informations du projet -->
        <div class="project-info">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          
          <div class="tech-stack">
            <span *ngFor="let tech of project.technologies">{{ tech }}</span>
          </div>
          
          <div class="project-links">
            <a [href]="project.link || '#'" 
               target="_blank" 
               rel="noopener"
               class="project-link">
              <i class="fas fa-external-link-alt"></i> Voir le projet
            </a>
            <a [href]="project.github || 'https://github.com/Stephano25'" 
               target="_blank" 
               rel="noopener"
               class="project-link">
              <i class="fab fa-github"></i> Code
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
