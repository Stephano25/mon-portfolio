<section class="skills-section">
  <div class="container">
    <div class="section-header reveal">
      <span class="section-label">Mon stack technique</span>
      <h2 class="section-title">Compétences</h2>
    </div>

    <div class="skills-grid">
      <div class="skill-category reveal-left" *ngFor="let category of skillCategories; let i = index" [class]="'delay-' + (i + 1)">
        <div class="category-header">
          <div class="category-icon">
            <i class="fas {{ category.icon }}"></i>
          </div>
          <h3>{{ category.title }}</h3>
        </div>
        <div class="skill-list">
          <div class="skill-item" *ngFor="let skill of category.skills">
            <div class="skill-info">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-percent">{{ skill.level }}%</span>
            </div>
            <div class="progress-bar">
              <div class="progress" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Technologies tags -->
    <div class="tech-section reveal">
      <h3 class="tech-title">Également utilisés</h3>
      <div class="tech-tags">
        <span class="tag" *ngFor="let tag of techTags">{{ tag }}</span>
      </div>
    </div>

    <!-- Soft skills -->
    <div class="soft-skills reveal">
      <h3 class="soft-title">Ce que je peux apporter de plus</h3>
      <div class="soft-grid">
        <div class="soft-item" *ngFor="let item of softSkills; let i = index" [class]="'delay-' + (i + 1)">
          <i class="fas {{ item.icon }}"></i>
          <p>{{ item.name }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
