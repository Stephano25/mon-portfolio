<section class="contact-section">
  <div class="container">
    <div class="section-header reveal">
      <span class="section-label">Contact</span>
      <h2 class="section-title">Me Contacter</h2>
      <p class="section-subtitle">Une opportunité à me proposer ? Écrivez-moi.</p>
    </div>

    <div class="contact-wrapper">
      <div class="contact-info reveal-left">
        <div class="info-item" *ngFor="let info of contactInfo; let i = index" [class]="'delay-' + (i + 1)">
          <div class="info-icon">
            <i class="{{ info.icon }}"></i>
          </div>
          <div class="info-content">
            <h4>{{ info.title }}</h4>
            <p *ngFor="let line of info.lines">{{ line }}</p>
          </div>
        </div>
      </div>

      <form class="contact-form reveal-right" (ngSubmit)="onSubmit()" #contactForm="ngForm">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Nom</label>
            <input type="text" id="name" name="name" placeholder="Votre nom" required ngModel>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Votre email" required ngModel>
          </div>
        </div>
        <div class="form-group">
          <label for="subject">Sujet</label>
          <input type="text" id="subject" name="subject" placeholder="Sujet" required ngModel>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Votre message" required ngModel></textarea>
        </div>
        <button type="submit" class="submit-btn">
          Envoyer le message <i class="fas fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>
</section>
