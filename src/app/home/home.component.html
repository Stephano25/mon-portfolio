<div class="home-container">
  <!-- Particules de fond -->
  <div class="particles">
    <div class="particle" 
         *ngFor="let p of particles" 
         [style.left.%]="p.left" 
         [style.top.%]="p.top"
         [style.animation-delay]="p.delay + 's'"
         [style.animation-duration]="p.duration + 's'">
    </div>
  </div>

  <div class="hero-content">
    <!-- ✅ Photo de profil -->
    <div class="profile-photo-wrapper animate-scale-in">
      <div class="profile-photo-ring"></div>
      <img 
        src="assets/images/profile/profile.jpg" 
        alt="NIRINA REMI Stephano" 
        class="profile-photo"
        onerror="this.src='https://ui-avatars.com/api/?name=Stephano+Nirina&size=200&background=6366f1&color=fff'">
      <span class="status-dot"></span>
    </div>

    <div class="badge animate-fade-in-up">
      <span class="badge-dot"></span>
      Disponible immédiatement
    </div>
    
    <p class="greeting animate-fade-in-up delay-1">Bonjour, je suis</p>
    
    <h1 class="hero-title animate-fade-in-up delay-2">
      NIRINA REMI <br>
      <span class="gradient-text">Stephano</span>
    </h1>
    
    <div class="role-container animate-fade-in-up delay-3">
      <span class="role-prefix">&lt;/&gt;</span>
      <span class="typed-text"></span>
      <span class="cursor">|</span>
    </div>
    
    <p class="location animate-fade-in-up delay-4">
      <i class="fas fa-map-marker-alt"></i>
      Toamasina, Madagascar
    </p>
    
    <p class="description animate-fade-in-up delay-5">
      Développeur Full Stack passionné, je transforme les idées en solutions digitales 
      innovantes. Spécialisé dans Angular, NestJS et les technologies modernes.
    </p>
    
    <div class="cta-buttons animate-fade-in-up delay-6">
      <button (click)="scrollToContact()" class="btn-primary">
        Me Contacter <i class="fas fa-arrow-right"></i>
      </button>
      <button (click)="scrollToProjects()" class="btn-secondary">
        Voir Projets <i class="fas fa-code"></i>
      </button>
    </div>
    
    <div class="social-links animate-fade-in-up delay-6">
      <a href="https://github.com/Stephano25" target="_blank" class="social-link">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://linkedin.com/in/nirina-remi-stephano" target="_blank" class="social-link">
        <i class="fab fa-linkedin-in"></i>
      </a>
      <a href="mailto:dazzremie@gmail.com" class="social-link">
        <i class="fas fa-envelope"></i>
      </a>
    </div>
  </div>

  <!-- Marquee des technologies -->
  <div class="tech-marquee">
    <div class="marquee-content">
      <span *ngFor="let tech of technologies">{{ tech }} ◆ </span>
      <span *ngFor="let tech of technologies">{{ tech }} ◆ </span>
    </div>
  </div>

  <!-- Indicateur de scroll -->
  <div class="scroll-indicator" (click)="scrollToAbout()">
    <div class="mouse">
      <div class="wheel"></div>
    </div>
    <span>Faites défiler</span>
  </div>
</div>
